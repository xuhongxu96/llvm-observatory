# Builds the site (build.yml) and publishes it to GitHub Pages.
#
# It runs on pushes to main, every Monday (to follow LLVM main), and by hand, with
# another LLVM ref to observe if wanted. The repository's Pages source must be set to
# "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "LLVM ref to observe (commit, tag or branch; empty: target_commit.txt)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # the Nix store cache deletes the entries it replaces

# A newer run replaces one still building.
concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      target: ${{ inputs.target }}
      pages: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A deployment is never cut short.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
